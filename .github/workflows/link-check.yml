name: Link Check

on:
  schedule:
    # Every Sunday at 7h UTC
    - cron: '0 7 * * 0'
  workflow_dispatch:

jobs:
  link-check:
    name: Check broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # --base-url, et non --base : lychee avertit que --base est déprécié
          # et sera retiré. Le domaine est emploia.eu, pas l'hôte Vercel : les
          # pages portent des liens absolus vers emploia.eu, donc une
          # exclusion écrite sur l'hôte Vercel ne les couvre plus. C'est ce
          # qui rendait les exclusions ci-dessous partiellement inopérantes.
          args: |
            --base-url https://emploia.eu
            --exclude "^https://emploia\.eu/(app|dashboard|profil|chat|cv-vault|alerts|apply-queue)"
            --exclude "^https://emploia\.eu/api/"
            --exclude "^https://fonts\."
            --exclude "^https://plausible\.io"
            --exclude "^https://js\.stripe\.com"
            --exclude "^https://instagram\.com"
            --timeout 20
            --retry-wait-time 5
            --max-retries 2
            "*.html"
            "blog/*.html"
            "emploi/*.html"
            "metier/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
