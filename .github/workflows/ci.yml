name: CI

on:
  # Le filtre reste sur `push`, et c'est le cas différent : sans lui, chaque
  # poussée d'une branche de travail relancerait les quatre jobs en plus du
  # run de sa propre PR. Il n'y a pas de double run pour autant — un commit
  # poussé sur une branche de PR ne déclenche que `pull_request` (la poussée
  # ne vise pas main), et une fusion dans main ne déclenche que `push` (le
  # type `closed` n'est pas dans les types par défaut de `pull_request`).
  push:
    branches: [main]

  # Pas de filtre `branches:` ici, et c'est tout le correctif. Le filtre d'un
  # `pull_request` porte sur la branche CIBLE, jamais sur la source : avec
  # `branches: [main]`, une PR empilée — celle qui en vise une autre plutôt
  # que main — ne déclenchait AUCUN des quatre jobs ci-dessous. Seuls les
  # déploiements Vercel s'affichaient, et leurs checks verts donnaient
  # l'illusion d'une PR gardée.
  #
  # La PR 83 en a fait la démonstration : elle ajoutait un garde tarifaire
  # câblé dans le job `guards`, et ce job n'a jamais tourné dessus. Même
  # famille que le garde des tests dormants — un contrôle câblé mais jamais
  # exécuté ne garde rien ; ici ce n'était pas le câblage qui manquait, mais
  # le déclencheur.
  pull_request:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  js-syntax:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check API files syntax
        run: |
          failed=0
          while IFS= read -r f; do
            node --check "$f" 2>&1 || failed=1
          done < <(find api -name "*.js")
          [ $failed -eq 0 ] && echo "All JS files OK" || exit 1

  html-lint:
    name: HTML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install htmlhint
        run: npm install -g htmlhint
      - name: Run htmlhint on HTML pages
        run: |
          htmlhint --config .htmlhintrc \
            "*.html" "blog/*.html" "emploi/*.html" "metier/*.html"

  guards:
    name: Route & Security Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate rewrites + security invariants
        run: node scripts/ci-guards.mjs
      - name: Déclencheurs des workflows (pull_request non restreint par un filtre de branches)
        run: node scripts/ci/declencheurs.test.mjs
      - name: Generation quality bench (detector self-test + prompt guard)
        run: node scripts/bench/run.mjs
      - name: Employer offer lifecycle tests
        run: node scripts/employer/expiry.test.mjs
      - name: Data-locality claims (RGPD, /sous-traitants)
        run: node scripts/rgpd/localisation.test.mjs
      - name: Bounded failure causes (aucun message d'exception dans /api/jobs)
        run: node scripts/smoke/causes.test.mjs
      - name: Type de contrat et salaire (lus depuis la donnée, jamais fabriqués)
        run: node scripts/smoke/contrat.test.mjs
      - name: Collecteur Greenhouse (un board en échec n'emporte pas les autres)
        run: node scripts/smoke/greenhouse.test.mjs
      - name: Helper d'envoi d'emails (reply_to présent, refus Resend remontés)
        run: node scripts/billing/email.test.mjs
      - name: Billing tests (Pack Campagne, grille tarifaire)
        run: node scripts/billing/campagne.test.mjs
      - name: B2B pricing grid (barème Écoles, plancher, seuil 40 k€)
        run: node scripts/pricing/ecoles.test.mjs
      - name: Source unique du barème Écoles (déclaration vs page, prompt, sonde)
        run: node scripts/pricing/bareme.test.mjs
      - name: Assertions de la sonde prod (aiguilles de contenu vs fichiers du dépôt)
        run: node scripts/smoke/assertions.test.mjs
      - name: Achat anonyme (le webhook n'abandonne jamais un paiement en silence)
        run: node scripts/billing/achat-anonyme.test.mjs
      - name: Alerte de régression SEO (création, dédoublonnage, répétition sans écriture)
        run: node scripts/seo/alerte-regression.test.mjs
      - name: Billing probes (checkout mode + webhook grant/rejeu + commissions)
        run: |
          node scripts/billing/probe-checkout.mjs
          node scripts/billing/probe-webhook.mjs
          node scripts/billing/probe-affiliate.mjs
