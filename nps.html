<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <title>Emploia — Ton avis compte</title>
  <meta name="description" content="Donne ton avis sur Emploia en 30 secondes — ton feedback améliore l'outil pour tous les chercheurs d'emploi."/>
  <link rel="canonical" href="https://emploia.eu/nps"/>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="/shared.css?v=e4ce16e9"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg3, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text, #1e293b);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo {
      margin: 40px auto 0;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Card */
    .card {
      background: var(--bg1, #ffffff);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 36px;
      max-width: 560px;
      width: calc(100% - 32px);
      margin: 36px auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text, #1e293b);
      text-align: center;
    }

    /* Score grid */
    .score-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .score-btn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 2px solid var(--border, #e2e8f0);
      background: var(--bg2, #f1f5f9);
      color: var(--text, #1e293b);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      outline: none;
    }

    .score-btn:hover {
      border-color: #6366f1;
      background: #eef2ff;
      transform: scale(1.08);
    }

    .score-btn.selected {
      background: #6366f1;
      border-color: #6366f1;
      color: #ffffff;
      transform: scale(1.12);
    }

    /* Labels */
    .score-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted, #94a3b8);
      margin-top: -12px;
    }

    /* Comment section */
    .comment-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .comment-section label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text, #1e293b);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border: 2px solid var(--border, #e2e8f0);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text, #1e293b);
      background: var(--bg2, #f8fafc);
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Thank-you / Already answered states */
    .message-box {
      text-align: center;
      padding: 16px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-box .emoji {
      font-size: 40px;
    }

    .message-box p {
      font-size: 16px;
      color: var(--text, #1e293b);
      line-height: 1.5;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 24px 16px;
      text-align: center;
    }

    footer a {
      font-size: 13px;
      color: var(--text-muted, #94a3b8);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div id="emp-scroll-prog"></div>

  <a href="/" class="logo" aria-label="Emploia">
    <div class="logo-icon">E</div>
    <span class="logo-text">Emploia</span>
  </a>

  <main class="card" id="app">
    <!-- Content injected by JS -->
  </main>

  <footer>
    <a href="/legal#mentions">Mentions légales &amp; Politique de confidentialité</a>
  </footer>

  <script src="/js/pages/nps.js?v=9491fbcc"></script>
</body>
</html>
